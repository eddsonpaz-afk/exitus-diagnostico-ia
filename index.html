 pedagógicas?","Como os professores utilizam a tecnologia para planejar aulas e produzir materiais alinhados ao planejamento pedagógico?","Como a escola utiliza informações sobre o desempenho dos alunos para identificar dificuldades de aprendizagem?","Como a inteligência artificial é utilizada para adaptar conteúdos e atividades às necessidades individuais dos estudantes?","Como a escola utiliza a tecnologia na elaboração e aplicação de provas e avaliações?","Como os professores utilizam ferramentas digitais para agilizar a correção de avaliações, mantendo a responsabilidade pela nota final?","Como a escola acompanha a evolução dos estudantes na produção de textos e redações?","Como os estudantes recebem apoio personalizado para revisar conteúdos, esclarecer dúvidas e desenvolver autonomia nos estudos?","Como a escola revisa e atualiza seus materiais didáticos a partir das necessidades de aprendizagem identificadas?","Como os resultados das avaliações são utilizados para orientar intervenções pedagógicas e replanejar atividades?"],["Como as iniciativas de tecnologia e inteligência artificial são incorporadas ao planejamento estratégico da escola?","Como a escola integra as informações acadêmicas, pedagógicas e administrativas utilizadas pelos diferentes departamentos?","Como a instituição avalia se os investimentos em tecnologia estão contribuindo para seus objetivos educacionais?","Como os indicadores de desempenho acadêmico e operacional são utilizados nas decisões da direção?","Como a escola identifica processos manuais e repetitivos que poderiam ser automatizados?","Como a instituição acompanha as famílias interessadas desde o primeiro contato até a confirmação da matrícula?","Como a direção acompanha os indicadores de captação, conversão e renovação de matrículas para orientar suas decisões?","Como a escola organiza e acompanha a comunicação com as famílias por meio de ferramentas digitais?","Como a direção identifica gargalos operacionais, duplicidade de infor /p><div class="progress"><i style="width:'+(pos+1)*10+'%"></i></div><h2>'+Q[phase][pos]+'</h2><div class="options">'+opts.map((o,i)=>'<button class="option" aria-pressed="'+(a[idx]===i+1)+'" onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div class="actions"><button class="secondary" onclick="back()">Voltar</button><button '+(a[idx]===null?'disabled':'')+' onclick="next()">'+(pos===9?'Concluir fase':'Avançar')+'</button></div></div>'}function choose(i){a[phase*10+pos]=i+1;question()}function back(){if(pos>0){pos--;question()}else menu()}function next(){if(a[phase*10+pos]===null)return;if(pos<9){pos++;question()}else{done=Math.max(done,phase+1);menu()}}function avg(v){let x=v.filter(n=>n>=1&&n<=4);return x.length?x.reduce((s,n)=>s+n,0)/x.length:null}function level(n){return n===null?'Dados insuficientes':n<1.75?'Inicial':n<2.5?'Em desenvolvimento':n<3.25?'Integrador':'Transformador'}function results(){let score=avg(a);let actions=['Formalize orientações de IA, revise práticas de avaliação e planeje formação docente.','Mapeie processos manuais, defina responsáveis e acompanhe indicadores institucionais.','Revise permissões de acesso, proteção de dados e protocolos de supervisão humana.'];el.innerHTML=note+'<div class="card"><div class="tag">RESULTADO INDIVIDUAL PROVISÓRIO</div><h2>'+level(score)+'</h2><div class="score">'+(score===null?'—':score.toFixed(2).replace('.',','))+' <small style="font-size:18px">/ 4</small></div><p>'+a.filter(n=>n>=1&&n<=4).length+' respostas válidas. Classificação de teste por média simples, ainda não validada.</p></div><h2>Seu plano de ação</h2><div class="grid">'+names.map((n,i)=>({n,i,s:avg(a.slice(i*10,i*10+10))})).sort((x,y)=>(x.s??Infinity)-(y.s??Infinity)).map(({n,i,s})=>{return '<div class="card"><h3>'+n+'</h3><p><strong>'+(s===null?'Sem dados':s.toFixed(2).replace('.',',')+' / 4')+'</strong></p><div class="progress"><i style="width:'+(s||0)*25+'%"></i></div><p>'+actions[i]+'</p></div>'}).join('')+'</div><button class="secondary" onclick="menu()">Revisar respostas</button>'}home();</script></body></html>
