<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Exitus Diagnóstico de IA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f6f8ff;color:#07143f}header{background:white;border-bottom:1px solid #e2ebff;padding:18px max(5vw,20px);display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{font-size:20px}header small{color:#4268d0}main{max-width:1100px;margin:auto;padding:44px 24px}h1{font-size:clamp(32px,5vw,58px);line-height:1.12;letter-spacing:-.04em;margin:15px 0}h2{font-size:clamp(23px,3vw,32px);line-height:1.35}p{line-height:1.65;color:#465678}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 20px;background:#153a95;color:white;font-weight:650}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#e2ebff;color:#153a95}.hero{background:linear-gradient(135deg,#fff,#e2ebff);border:1px solid #dce6ff;border-radius:30px;padding:clamp(24px,5vw,64px);display:grid;grid-template-columns:1.5fr 1fr;gap:30px;align-items:center}.eyebrow{font-size:13px;letter-spacing:.1em;color:#4268d0;font-weight:750}.orb{aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 20%,#a8c2ff 21% 24%,#e2ebff 25% 42%,#6489f3 43% 46%,#e2ebff 47% 63%,#a8c2ff 64% 65%,transparent 66%);display:grid;place-items:center;font-size:48px;font-weight:bold;color:#153a95}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:24px 0}.card{background:white;border:1px solid #dce6ff;border-radius:20px;padding:24px;box-shadow:0 8px 32px #07143f08}.card h3{margin-top:10px}.tag{font-size:13px;color:#4268d0;font-weight:700}.progress{height:8px;background:#e2ebff;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;background:#4268d0}.options{display:grid;gap:10px}.option{background:white;color:#07143f;border:1px solid #cbd7ef;text-align:left;font-weight:500;line-height:1.5}.option[aria-pressed=true]{background:#e2ebff;border:2px solid #4268d0}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.notice{font-size:13px;background:#fff4d8;border-radius:12px;padding:12px 16px;color:#694d19;margin-bottom:22px}.score{font-size:52px;font-weight:800;color:#153a95}label{display:block;margin:14px 0 6px;font-weight:600}select{padding:12px;border:1px solid #cbd7ef;border-radius:10px;width:100%;font:inherit;background:white;color:#07143f}footer{max-width:1100px;margin:auto;padding:20px 24px;color:#66718c;font-size:13px}@media(max-width:700px){.hero,.grid{grid-template-columns:1fr}.orb{display:none}header small{display:none}main{padding:22px 16px}.card{padding:18px}}</style></head><body><header><strong>EXITUS <span style="color:#4268d0">| Diagnóstico de IA</span></strong><small>Prévia de desenvolvimento</small></header><main id="app"></main><footer>Protótipo de avaliação institucional. Não representa certificação de maturidade.</footer><script>const Q=[["Como a escola define e comunica as orientações para o uso da inteligência artificial nas atividades pedagógicas?","Como os professores utilizam a tecnologia para planejar aulas e produzir materiais alinhados ao planejamento pedagógico?","Como a escola utiliza informações sobre o desempenho dos alunos para identificar dificuldades de aprendizagem?","Como a inteligência artificial é utilizada para adaptar conteúdos e atividades às necessidades individuais dos estudantes?","Como a escola utiliza a tecnologia na elaboração e aplicação de provas e avaliações?","Como os professores utilizam ferramentas digitais para agilizar a correção de avaliações, mantendo a responsabilidade pela nota final?","Como a escola acompanha a evolução dos estudantes na produção de textos e redações?","Como os estudantes recebem apoio personalizado para revisar conteúdos, esclarecer dúvidas e desenvolver autonomia nos estudos?","Como a escola revisa e atualiza seus materiais didáticos a partir das necessidades de aprendizagem identificadas?","Como os resultados das avaliações são utilizados para orientar intervenções pedagógicas e replanejar atividades?"],["Como as iniciativas de tecnologia e inteligência artificial são incorporadas ao planejamento estratégico da escola?","Como a escola integra as informações acadêmicas, pedagógicas e administrativas utilizadas pelos diferentes departamentos?","Como a instituição avalia se os investimentos em tecnologia estão contribuindo para seus objetivos educacionais?","Como os indicadores de desempenho acadêmico e operacional são utilizados nas decisões da direção?","Como a escola identifica processos manuais e repetitivos que poderiam ser automatizados?","Como a instituição acompanha as famílias interessadas desde o primeiro contato até a confirmação da matrícula?","Como a direção acompanha os indicadores de captação, conversão e renovação de matrículas para orientar suas decisões?","Como a escola organiza e acompanha a comunicação com as famílias por meio de ferramentas digitais?","Como a direção identifica gargalos operacionais, duplicidade de informações e retrabalho entre os setores?","Como a escola acompanha os resultados das iniciativas tecnológicas e decide quais devem ser ampliadas, ajustadas ou descontinuadas?"],["Como a escola garante que as decisões pedagógicas apoiadas pela inteligência artificial sejam supervisionadas pelos professores?","Como a instituição protege os dados pessoais e acadêmicos dos estudantes em suas ferramentas digitais?","Como os conteúdos produzidos com inteligência artificial são revisados e validados antes de serem utilizados em sala de aula?","Como a escola verifica a qualidade e a confiabilidade das correções de provas e redações apoiadas pela inteligência artificial?","Como as famílias recebem informações sobre o desenvolvimento acadêmico dos estudantes e as ações pedagógicas realizadas?","Como as famílias são orientadas sobre os benefícios, limites e riscos das tecnologias utilizadas pela escola?","Como a escola define responsabilidades e permissões de acesso às informações acadêmicas e administrativas?","Como a instituição verifica a confiabilidade das informações utilizadas em seus relatórios e decisões?","Como a escola previne e enfrenta situações de uso inadequado da inteligência artificial, incluindo manipulação de imagens e ciberbullying?","Como a escola orienta os estudantes sobre autoria, pensamento crítico, autonomia e utilização responsável da inteligência artificial?"]];const names=['Orientações e práticas educativas','Estratégia e decisões institucionais','Cuidado e responsabilidade institucional'];const opts=['Não existem práticas ou orientações institucionais definidas, ou elas não são compartilhadas de forma consistente.','Existem iniciativas ou orientações iniciais, mas sua aplicação ainda não ocorre de forma uniforme.','Existem práticas e orientações claras, comunicadas e aplicadas de forma consistente.','As práticas estão integradas à gestão da escola e são revisadas com base em evidências e resultados.','Não sei responder, não possuo informações suficientes ou a situação não se aplica à minha experiência.'];let a=Array(30).fill(null),phase=0,pos=0,done=0;const el=document.getElementById('app');const note='<div class="notice">Ambiente de demonstração: não informe dados pessoais reais. As respostas ficam somente nesta sessão. Integração com Google Sheets ainda não ativa.</div>';function home(){el.innerHTML=note+'<div class="hero"><div><div class="eyebrow">DIAGNÓSTICO GRATUITO • EDUCAÇÃO E TECNOLOGIA</div><h1>Sua escola está preparada para a era da inteligência artificial?</h1><p>Descubra como sua instituição utiliza a IA e a tecnologia na rotina pedagógica e administrativa.</p><button onclick="register()">Iniciar diagnóstico</button><p>30 perguntas · 3 fases · aproximadamente 15 minutos</p></div><div class="orb" aria-hidden="true">IA</div></div><div class="grid">'+names.map((n,i)=>'<div class="card"><div class="tag">DIMENSÃO '+(i+1)+'</div><h3>'+n+'</h3><p>10 perguntas sobre práticas e processos institucionais.</p></div>').join('')+'</div>'}function register(){el.innerHTML=note+'<div class="card" style="max-width:650px;margin:auto"><h2>Antes de começar</h2><p>Esta prévia utiliza o questionário de direção escolar. Os outros perfis serão desenvolvidos posteriormente.</p><label for="role">Perfil de teste</label><select id="role"><option>Diretor ou mantenedor</option></select><div class="actions"><button class="secondary" onclick="home()">Voltar</button><button onclick="menu()">Continuar sem cadastro real</button></div></div>'}function menu(){el.innerHTML=note+'<div class="eyebrow">SEU DIAGNÓSTICO</div><h2>Complete as três fases</h2><p>'+a.filter(x=>x!==null).length+' de 30 respostas</p><div class="progress"><i style="width:'+a.filter(x=>x!==null).length/30*100+'%"></i></div><div class="grid">'+names.map((n,i)=>'<div class="card"><div class="tag">FASE '+(i+1)+'</div><h3>'+n+'</h3><p>10 perguntas · 5 min</p><button '+(i>done?'disabled':'')+' onclick="start('+i+')">'+(i<done?'Revisar':i===done?'Iniciar fase':'Bloqueada')+'</button></div>').join('')+'</div>'+(done===3?'<button onclick="results()">Ver resultado</button>':'')}function start(i){phase=i;pos=0;question()}function question(){let idx=phase*10+pos;el.innerHTML=note+'<div class="card" style="max-width:860px;margin:auto"><div class="tag">FASE '+(phase+1)+' · '+names[phase]+'</div><p>Pergunta '+(pos+1)+' de 10</p><div class="progress"><i style="width:'+(pos+1)*10+'%"></i></div><h2>'+Q[phase][pos]+'</h2><div class="options">'+opts.map((o,i)=>'<button class="option" aria-pressed="'+(a[idx]===i+1)+'" onclick="choose('+i+')">'+String.fromCharCode(65+i)+'. '+o+'</button>').join('')+'</div><div class="actions"><button class="secondary" onclick="back()">Voltar</button><button '+(a[idx]===null?'disabled':'')+' onclick="next()">'+(pos===9?'Concluir fase':'Avançar')+'</button></div></div>'}function choose(i){a[phase*10+pos]=i+1;question()}function back(){if(pos>0){pos--;question()}else menu()}function next(){if(a[phase*10+pos]===null)return;if(pos<9){pos++;question()}else{done=Math.max(done,phase+1);menu()}}function avg(v){let x=v.filter(n=>n>=1&&n<=4);return x.length?x.reduce((s,n)=>s+n,0)/x.length:null}function level(n){return n===null?'Dados insuficientes':n<1.75?'Inicial':n<2.5?'Em desenvolvimento':n<3.25?'Integrador':'Transformador'}function results(){let score=avg(a);let actions=['Formalize orientações de IA, revise práticas de avaliação e planeje formação docente.','Mapeie processos manuais, defina responsáveis e acompanhe indicadores institucionais.','Revise permissões de acesso, proteção de dados e protocolos de supervisão humana.'];el.innerHTML=note+'<div class="card"><div class="tag">RESULTADO INDIVIDUAL PROVISÓRIO</div><h2>'+level(score)+'</h2><div class="score">'+(score===null?'—':score.toFixed(2).replace('.',','))+' <small style="font-size:18px">/ 4</small></div><p>'+a.filter(n=>n>=1&&n<=4).length+' respostas válidas. Classificação de teste por média simples, ainda não validada.</p></div><h2>Seu plano de ação</h2><div class="grid">'+names.map((n,i)=>{let s=avg(a.slice(i*10,i*10+10));return '<div class="card"><h3>'+n+'</h3><p><strong>'+(s===null?'Sem dados':s.toFixed(2).replace('.',',')+' / 4')+'</strong></p><div class="progress"><i style="width:'+(s||0)*25+'%"></i></div><p>'+actions[i]+'</p></div>'}).join('')+'</div><button class="secondary" onclick="menu()">Revisar respostas</button>'}home();</script></body></html>
